name: Release

# Push a tag like v1.0.0 and this builds TypeClip.zip and attaches it to a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh --zip
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: build/TypeClip.zip
          generate_release_notes: true
